name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Apply plugin patches
        # Re-apply local patches to plugin dist files (idempotent).
        # Needed because `quartz plugin install` restores the upstream dist
        # and would otherwise clobber our patches.
        run: |
          node scripts/patch-ofm-svg.mjs
          node scripts/patch-recent-notes.mjs
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-2.outputs.page_url || steps.deployment-3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # GitHub Pages' deploy API sporadically returns "Deployment failed, try
      # again later." even when the artifact is valid. Wrap the deploy in a
      # retry ladder so transient backend errors self-heal within a single run.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy attempt 1 failed. Sleeping 30s before retry."
          sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment-2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        run: |
          echo "::warning::Pages deploy attempt 2 failed. Sleeping 60s before final retry."
          sleep 60

      - name: Deploy to GitHub Pages (final attempt)
        id: deployment-3
        if: steps.deployment.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
